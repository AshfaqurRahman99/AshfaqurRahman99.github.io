<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Footprints | Ashfaqur Rahman</title>
    <link rel="icon" type="image/svg+xml" href="faviconAR.svg" />

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* -------------------------
           DYNAMIC BACKGROUNDS & EFFECTS
           ------------------------- */
      /* Light Mode Dynamic Gradient */
      .bg-light-dynamic {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -3;
        background: linear-gradient(-45deg, #f8fafc, #e0f2f1, #e0e7ff, #f8fafc);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }

      /* Dark Mode Aurora Background */
      .aurora-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -3;
        background-color: #0f172a;
        overflow: hidden;
        display: none;
      }
      .aurora-1,
      .aurora-2 {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.4;
        animation: auroraMove 20s alternate infinite ease-in-out;
      }
      .aurora-1 {
        width: 60vw;
        height: 60vh;
        background: #079992;
        top: -10%;
        left: -10%;
      }
      .aurora-2 {
        width: 50vw;
        height: 50vh;
        background: #3b82f6;
        bottom: -10%;
        right: -10%;
        animation-delay: -10s;
      }

      @keyframes auroraMove {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(25vw, 15vh) scale(1.3);
        }
      }
      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Grid Pattern */
      .bg-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      /* Solar System Animation (Dark Mode Only) */
      .solar-system {
        position: fixed;
        top: 120px;
        right: 5%;
        z-index: -1;
        width: 200px;
        height: 200px;
        display: none;
        opacity: 0.25;
        pointer-events: none;
      }
      .sun {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 24px;
        height: 24px;
        background: #f59e0b;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 30px #f59e0b;
      }
      .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px dashed rgba(255, 255, 255, 0.2);
        border-radius: 50%;
      }
      .orbit-1 {
        width: 70px;
        height: 70px;
        animation: spin 8s linear infinite;
      }
      .orbit-2 {
        width: 120px;
        height: 120px;
        animation: spin 15s linear infinite;
      }
      .orbit-3 {
        width: 180px;
        height: 180px;
        animation: spin 25s linear infinite;
      }
      .planet {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        position: absolute;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
      }
      .planet-1 {
        background: #079992;
      }
      .planet-2 {
        background: #3b82f6;
        width: 12px;
        height: 12px;
        top: -6px;
      }
      .planet-3 {
        background: #ec4899;
      }

      @keyframes spin {
        100% {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* -------------------------
           BASE STYLES & GLASSMORPHISM
           ------------------------- */
      html {
        scroll-behavior: smooth;
        font-size: 85%;
      }

      body {
        font-family: "Inter", sans-serif;
        color: #334155;
        background-color: transparent; /* Changed to transparent for bg to show */
        line-height: 1.7;
        padding-top: 80px;
      }

      /* Glassmorphism for Navbar */
      .navbar {
        background-color: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(10px);
        box-shadow: 0 1px 10px rgba(0, 0, 0, 0.05);
      }
      .navbar-brand {
        font-weight: 700;
        color: #0f172a !important;
      }
      .back-link {
        font-weight: 600;
        color: #475569;
        text-decoration: none;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: #2563eb;
      }

      /* -------------------------
           TRAVEL SECTION STYLES
           ------------------------- */
      #travel-portfolio {
        font-family: "Poppins", sans-serif;
      }
      #travel-portfolio h2 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 32px;
        font-weight: 700;
        color: #2c3e50;
      }

      .container {
        max-width: 1600px; /* 1200px theke bariye 1600px kora holo */
        width: 96%; /* Screen er 96% jayga jure thakbe */
        margin: 0 auto;
        padding: 10px 10px 40px 10px; /* Top padding 40px theke kumiye 10px kora holo */
      }

      .flag-bar {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 10px 5px 15px 5px;
        margin-bottom: 30px;
        scrollbar-width: thin;
        scrollbar-color: #2ecc71 transparent;
      }
      .flag-bar::-webkit-scrollbar {
        height: 8px;
      }
      .flag-bar::-webkit-scrollbar-track {
        background: transparent;
        border-radius: 4px;
      }
      .flag-bar::-webkit-scrollbar-thumb {
        background: #2ecc71;
        border-radius: 4px;
      }

      /* Glassmorphism for Cards */
      .flag-card,
      .map-panel,
      .gallery-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 15px;
      }
      .map-panel {
        padding: 25px;
        flex: 1.2;
      }
      .gallery-panel {
        padding: 25px;
        flex: 1;
        overflow: hidden;
      }

      .flag-card {
        min-width: 160px; /* Card ekhon rectangle hobe */
        min-height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        padding: 10px;
        cursor: pointer;
        transition:
          transform 0.3s,
          box-shadow 0.3s,
          border-color 0.3s,
          background 0.3s;
        user-select: none;
      }
      .flag-card:hover,
      .flag-card.active {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(7, 153, 146, 0.15);
        border-color: #079992;
        background: rgba(255, 255, 255, 0.9);
      }
      .flag-emoji {
        font-size: 55px; /* Flag er area onek boro kora hoyeche */
        line-height: 1.1;
        margin-bottom: 5px;
      }
      .flag-name {
        font-size: 16px;
        font-weight: 700;
        margin-top: 2px;
        white-space: nowrap;
      }
      /* End (Edited) */

      .travel-content {
        display: flex;
        gap: 30px;
        align-items: flex-start;
      }

      .status-header {
        background: rgba(241, 243, 245, 0.7);
        padding: 15px 20px;
        border-radius: 10px;
        font-weight: 500;
        margin-bottom: 25px;
        font-size: 16px;
        color: #34495e;
        border-left: 4px solid #079992;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-header i {
        color: #079992;
        font-size: 18px;
      }
      .header-divider {
        color: #bdc3c7;
        margin: 0 10px;
      }

      .gallery-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(233, 236, 239, 0.5);
      }
      #gallery-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        color: #2c3e50;
      }

      #photo-location {
        font-size: 14px;
        font-weight: 600;
        color: #079992;
        background: rgba(224, 242, 241, 0.8);
        padding: 8px 16px;
        border-radius: 30px;
        text-align: right;
        box-shadow: 0 2px 8px rgba(7, 153, 146, 0.15);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .svg-container {
        text-align: center;
        min-height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .svg-container svg {
        width: 100%;
        height: auto;
        max-height: 550px;
        filter: drop-shadow(0px 10px 10px rgba(0, 0, 0, 0.05));
      }
      .svg-container path,
      .svg-container rect,
      .svg-container polygon,
      .svg-container g {
        transition:
          fill 0.3s,
          opacity 0.3s;
        stroke: #ffffff;
        stroke-width: 1px;
      }

      .area-not-visited,
      .area-not-visited path {
        fill: #cbd5e1 !important;
        cursor: pointer !important;
      }
      .area-not-visited:hover,
      .area-not-visited:hover path {
        fill: #f1c40f !important;
      }
      .area-visited,
      .area-visited path {
        fill: #82ccdd !important;
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="%23e74c3c"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>')
            14 28,
          auto !important;
      }
      .area-visited:hover,
      .area-visited:hover path {
        fill: #60a3bc !important;
      }
      .area-active,
      .area-active path {
        fill: #079992 !important;
      }

      /* ==================================================
           CLEAN & PROFESSIONAL CAROUSEL (Fade & Gentle Slide)
           ================================================== */
      .carousel-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 550px; /* 400px theke bariye 550px kora holo jate image lamba ebong chawra hote pare */
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .carousel-track {
        position: relative;
        width: 100%; /* Now takes full width */
        height: 100%;
      }

      .carousel-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Forces image to crop beautifully */
        border-radius: 12px;

        /* Smooth Premium Transition */
        transition:
          transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
          opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      }

      /* Clean Transitions (No Overlap) */
      .carousel-img.active {
        z-index: 3;
        transform: translateX(0) scale(1);
        opacity: 1;
        pointer-events: auto;
      }
      .carousel-img.prev {
        z-index: 2;
        transform: translateX(-50px) scale(0.95);
        opacity: 0;
        pointer-events: none;
      }
      .carousel-img.next {
        z-index: 2;
        transform: translateX(50px) scale(0.95);
        opacity: 0;
        pointer-events: none;
      }
      .carousel-img.hidden {
        z-index: 1;
        transform: scale(0.9);
        opacity: 0;
        pointer-events: none;
      }

      /* Buttons strictly inside the image for a cleaner look */
      .nav-btn {
        position: absolute;
        z-index: 5;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(15, 23, 42, 0.4);
        color: #fff;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .nav-btn:hover {
        background: #079992;
        transform: translateY(-50%) scale(1.1);
        border-color: #079992;
      }
      #btn-prev {
        left: 15px;
      }
      #btn-next {
        right: 15px;
      }

      @media (max-width: 768px) {
        .carousel-wrapper {
          aspect-ratio: 4/3;
        }
        .nav-btn {
          width: 35px;
          height: 35px;
          font-size: 14px;
        }
        #btn-prev {
          left: 10px;
        }
        #btn-next {
          right: 10px;
        }
      }

      .custom-footer {
        background-color: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        color: #f8fafc;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 25px 20px;
        font-size: 0.9rem;
        margin-top: 60px;
        border-radius: 8px;
      }
      .custom-footer a {
        color: #93c5fd;
      }
      .custom-footer a:hover {
        color: #eff6ff;
        text-decoration: underline;
      }

      /* -------------------------
           MASTER DARK MODE FIX
           ------------------------- */
      body.dark-theme .bg-light-dynamic {
        display: none;
      }
      body.dark-theme .aurora-bg {
        display: block;
      }
      body.dark-theme .solar-system {
        display: block;
      }
      body.dark-theme .bg-grid {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      }

      body.dark-theme {
        color: #cbd5e1 !important;
      }
      body.dark-theme .navbar {
        background-color: rgba(30, 41, 59, 0.85) !important;
        border-color: #334155 !important;
      }
      body.dark-theme .navbar-brand,
      body.dark-theme .back-link {
        color: #f8fafc !important;
      }
      body.dark-theme .back-link:hover {
        color: #60a5fa !important;
      }

      body.dark-theme #travel-portfolio h2 {
        color: #f8fafc !important;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }

      /* Glassmorphism for Dark Mode */
      body.dark-theme .flag-card,
      body.dark-theme .map-panel,
      body.dark-theme .gallery-panel {
        background: rgba(30, 41, 59, 0.65) !important;
        border-color: rgba(255, 255, 255, 0.05) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
        color: #f8fafc;
      }
      body.dark-theme .flag-name {
        color: #cbd5e1;
      }
      body.dark-theme .flag-card:hover,
      body.dark-theme .flag-card.active {
        border-color: #079992 !important;
        background: rgba(30, 41, 59, 0.9) !important;
        box-shadow: 0 0 20px rgba(7, 153, 146, 0.3) !important;
      }

      body.dark-theme .status-header {
        background-color: rgba(15, 23, 42, 0.7);
        border-left-color: #079992;
        color: #f8fafc;
      }
      body.dark-theme .gallery-header {
        border-bottom-color: rgba(255, 255, 255, 0.1);
      }
      body.dark-theme #gallery-title {
        color: #f8fafc !important;
      }
      body.dark-theme #photo-location {
        background-color: rgba(15, 23, 42, 0.8);
        color: #60a5fa;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      /* Map Colors in Dark Mode */
      body.dark-theme .svg-container svg {
        filter: drop-shadow(0px 0px 15px rgba(7, 153, 146, 0.2));
      }
      body.dark-theme .area-not-visited,
      body.dark-theme .area-not-visited path {
        fill: #334155 !important;
        stroke: #1e293b;
      }
      body.dark-theme .area-not-visited:hover,
      body.dark-theme .area-not-visited:hover path {
        fill: #f59e0b !important;
      }
      body.dark-theme .area-visited,
      body.dark-theme .area-visited path {
        fill: #1d4ed8 !important;
      }
      body.dark-theme .area-visited:hover,
      body.dark-theme .area-visited:hover path {
        fill: #3b82f6 !important;
      }
      body.dark-theme .area-active,
      body.dark-theme .area-active path {
        fill: #10b981 !important;
        filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.5));
      }
      body.dark-theme #carousel-counter {
        color: #cbd5e1 !important;
      }

      @media (max-width: 768px) {
        .travel-content {
          flex-direction: column;
        }
        .map-panel,
        .gallery-panel {
          width: 100%;
        }
        .carousel-wrapper {
          aspect-ratio: 4/3;
        }
        .carousel-img.prev {
          transform: translateX(-35%) scale(0.85);
        }
        .carousel-img.next {
          transform: translateX(35%) scale(0.85);
        }
        #photo-location {
          font-size: 12px;
          padding: 6px 12px;
        }
        .status-header {
          font-size: 14px;
          flex-wrap: wrap;
        }
        .solar-system {
          display: none;
        } /* Hide on mobile to save space */
      }
    </style>
  </head>

  <body>
    <!-- ==============================================
         DYNAMIC BACKGROUND ELEMENTS
         ============================================== -->
    <!-- 1. Light Mode Animated Gradient -->
    <div class="bg-light-dynamic"></div>

    <!-- 2. Dark Mode Aurora (Northern Lights) -->
    <div class="aurora-bg">
      <div class="aurora-1"></div>
      <div class="aurora-2"></div>
    </div>

    <!-- 3. Overall Grid Pattern Overlay -->
    <div class="bg-grid"></div>

    <!-- 4. Dark Mode Solar System Animation -->
    <div class="solar-system">
      <div class="sun"></div>
      <div class="orbit orbit-1"><div class="planet planet-1"></div></div>
      <div class="orbit orbit-2"><div class="planet planet-2"></div></div>
      <div class="orbit orbit-3"><div class="planet planet-3"></div></div>
    </div>

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top border-bottom">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="index.html">Ashfaqur Rahman</a>
        <div class="ms-auto">
          <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
        </div>
      </div>
    </nav>

    <!-- Content Area: Travel Portfolio -->
    <div class="container mt-2 mb-5">
      <section id="travel-portfolio">
        <div class="row mb-3">
          <div class="col-12 text-center">
            <h2>Explore My Travels</h2>
            <p
              class="lead"
              style="
                font-family: &quot;Inter&quot;, sans-serif;
                font-size: 1.05rem;
                color: inherit;
                opacity: 0.8;
              "
            >
              Mapping my journey and visual memories around the world.
            </p>
          </div>
        </div>

        <div id="flag-bar" class="flag-bar"></div>

        <div class="travel-content">
          <!-- Map Panel -->
          <div class="map-panel">
            <div id="status-header" class="status-header">
              <i class="fa-solid fa-earth-americas"></i>
              <span id="current-country">Country</span>
              <span class="header-divider">|</span>
              <span id="current-region-icon"
                ><i class="fa-solid fa-map-location-dot"></i
              ></span>
              <span id="current-region">All Regions</span>
            </div>
            <div id="svg-container" class="svg-container"></div>
          </div>

          <!-- Gallery Panel -->
          <div class="gallery-panel" id="gallery-section">
            <div class="gallery-header">
              <h3 id="gallery-title">Memories</h3>
              <div id="photo-location"></div>
            </div>

            <div class="carousel-wrapper">
              <button class="nav-btn" id="btn-prev" onclick="moveCarousel(-1)">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <div id="carousel-track" class="carousel-track"></div>
              <button class="nav-btn" id="btn-next" onclick="moveCarousel(1)">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
            <!-- এই নতুন কাউন্টার লাইনটি অ্যাড করুন -->
            <div
              id="carousel-counter"
              class="text-center mt-3 fw-bold text-muted"
              style="font-size: 0.9rem; letter-spacing: 0.5px"
            ></div>
          </div>
        </div>
      </section>

      <!-- FOOTER -->
      <div class="custom-footer dark-footer">
        Site last updated: <span id="last-updated-date"></span> &bull; &copy;
        <span id="current-year"></span> Ashfaqur Rahman (BSc. in IPE, KUET)
        &bull;
        <a
          href="https://mail.google.com/mail/?view=cm&fs=1&to=ashfaqurshanto08@gmail.com"
          >ashfaqurshanto08@gmail.com</a
        >
      </div>
    </div>

    <!-- Floating Dark Mode Toggle Button -->
    <button
      id="theme-toggle"
      class="btn btn-dark"
      style="
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
        border-radius: 50px;

    <!-- Dark Mode Logic -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const themeToggle = document.getElementById("theme-toggle");
        const body = document.body;
        const icon = themeToggle.querySelector("i");

        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        );
        const savedTheme = localStorage.getItem("user_theme_priority");

        if (
          savedTheme === "dark" ||
          (savedTheme === null && systemPrefersDark.matches)
        ) {
          body.classList.add("dark-theme");
          icon.classList.replace("fa-moon", "fa-sun");
          themeToggle.classList.replace("btn-dark", "btn-light");
        } else {
          body.classList.remove("dark-theme");
          if (icon.classList.contains("fa-sun"))
            icon.classList.replace("fa-sun", "fa-moon");
          if (themeToggle.classList.contains("btn-light"))
            themeToggle.classList.replace("btn-light", "btn-dark");
        }

        themeToggle.addEventListener("click", function () {
          body.classList.toggle("dark-theme");
          if (body.classList.contains("dark-theme")) {
            localStorage.setItem("user_theme_priority", "dark");
            icon.classList.replace("fa-moon", "fa-sun");
            themeToggle.classList.replace("btn-dark", "btn-light");
          } else {
            localStorage.setItem("user_theme_priority", "light");
            icon.classList.replace("fa-sun", "fa-moon");
            themeToggle.classList.replace("btn-light", "btn-dark");
          }
        });

        systemPrefersDark.addEventListener("change", (event) => {
          if (localStorage.getItem("user_theme_priority") === null) {
            if (event.matches) {
              body.classList.add("dark-theme");
              icon.classList.replace("fa-moon", "fa-sun");
              themeToggle.classList.replace("btn-dark", "btn-light");
            } else {
              body.classList.remove("dark-theme");
              icon.classList.replace("fa-sun", "fa-moon");
              themeToggle.classList.replace("btn-light", "btn-dark");
            }
          }
        });
      });
    </script>

      async function loadCountry(countryKey, btnElement) {
        const data = travelData[countryKey];
        const svgContainer = document.getElementById("svg-container");

        activeRegionKey = null;
        activeRegionName = "All Regions";
        document.getElementById("current-country").innerHTML =
          `<b>${data.name}</b>`;
        updateHeaderStatus();

        document
          .querySelectorAll(".flag-card")
          .forEach((el) => el.classList.remove("active"));

        // UI interaction for clicked button
        if (btnElement) {
          btnElement.classList.add("active");
          // Scroll the flag bar horizontally
          btnElement.scrollIntoView({
            behavior: "smooth",
            inline: "center",
            block: "nearest",
          });

          // Auto Smooth Scroll down to the Map and Photo area
          setTimeout(() => {
            const mapSection = document.querySelector(".travel-content");
            // 100px offset rakha hoyeche jate fixed navbar er niche map na hariye jay
            const yPosition =
              mapSection.getBoundingClientRect().top + window.scrollY - 100;
            window.scrollTo({ top: yPosition, behavior: "smooth" });
          }, 200); // Map load howar jonno choto ekta delay
        }

        svgContainer.innerHTML = `<p style="color: #888;">Loading Map...</p>`;

        try {
          const response = await fetch(data.mapUrl);
          if (!response.ok) throw new Error("Map not found");
          svgContainer.innerHTML = await response.text();
          setupMapInteractions(data);
        } catch (error) {
          svgContainer.innerHTML = `<p style="color:red"><i class="fa-solid fa-triangle-exclamation"></i> Please ensure ${data.mapUrl} exists.</p>`;
        }

        renderAllPhotos(data);
      }

      function setupMapInteractions(data) {
        const svgContainer = document.getElementById("svg-container");
        const regions = svgContainer.querySelectorAll("path, rect, polygon, g");

        regions.forEach((regionArea) => {
          let rawId =
            regionArea.getAttribute("id") ||
            regionArea.getAttribute("name") ||
            "";
          const regionId = rawId.toLowerCase().trim();

          if (!regionId) return;

          const regionData = data.regions[regionId];

          if (regionData) {
            regionArea.classList.add(
              regionData.visited ? "area-visited" : "area-not-visited",
            );

            regionArea.addEventListener("mouseenter", () => {
              if (regionData.visited) {
                document.getElementById("current-region-icon").innerHTML =
                  `<i class="fa-solid fa-circle-check" style="color:#2ecc71;"></i>`;
                document.getElementById("current-region").innerHTML =
                  `<span style="color:#079992; font-weight:600;">Visited : ${regionData.name}</span>`;
              } else {
                document.getElementById("current-region-icon").innerHTML =
                  `<i class="fa-solid fa-circle-minus" style="color:#f39c12;"></i>`;
                document.getElementById("current-region").innerHTML =
                  `<span style="color:#f39c12; font-weight:600;">Not Visited : ${regionData.name}</span>`;
              }
            });

            regionArea.addEventListener("mouseleave", () =>
              updateHeaderStatus(),
            );

            regionArea.addEventListener("click", () => {
              if (regionData.visited) {
                document
                  .querySelectorAll(".area-active")
                  .forEach((el) => el.classList.remove("area-active"));
                regionArea.classList.add("area-active");

                activeRegionKey = regionId;
                activeRegionName = regionData.name;
                updateHeaderStatus();

                document.getElementById("gallery-title").textContent =
                  `${regionData.name}`;
                loadPhotosIntoCarousel(regionData.photos);
              }
            });
          } else if (
            regionArea.tagName.toLowerCase() === "path" &&
            !regionArea.closest("g[id]") &&
            !regionArea.closest("g[name]")
          ) {
            regionArea.classList.add("area-not-visited");
          }
        });
      }

      function updateHeaderStatus() {
        if (activeRegionKey) {
          document.getElementById("current-region-icon").innerHTML =
            `<i class="fa-solid fa-location-crosshairs" style="color:#079992;"></i>`;
          document.getElementById("current-region").innerHTML =
            `<span style="color:#079992; font-weight:600;">Selected: ${activeRegionName}</span>`;
        } else {
          document.getElementById("current-region-icon").innerHTML =
            `<i class="fa-solid fa-map-location-dot" style="color:#079992;"></i>`;
          document.getElementById("current-region").innerHTML =
            "All Visited Regions";
        }
      }

      function renderAllPhotos(countryData) {
        document.getElementById("gallery-title").textContent =
          `All Memories of ${countryData.name}`;
        let allPhotos = [];
        Object.values(countryData.regions).forEach((region) => {
          if (region.visited) {
            const taggedPhotos = region.photos.map((p) => ({
              url: p.url,
              location: `${p.location} (${region.name})`,
            }));
            allPhotos = allPhotos.concat(taggedPhotos);
          }
        });
        loadPhotosIntoCarousel(allPhotos);
      }

      let autoPlayInterval = null; // অটো-স্ক্রল টাইমার স্টোর করার জন্য

      function loadPhotosIntoCarousel(photos) {
        currentPhotos = photos;
        carouselIndex = 0;

        const track = document.getElementById("carousel-track");
        const counterText = document.getElementById("carousel-counter"); // নতুন কাউন্টার
        track.innerHTML = "";

        if (currentPhotos.length === 0) {
          track.innerHTML = "<p style='color:#888'>No photos available.</p>";
          document.getElementById("photo-location").style.display = "none";
          if (counterText) counterText.style.display = "none"; // ছবি না থাকলে কাউন্টার হাইড হবে
          stopAutoPlay();
          return;
        }

        currentPhotos.forEach((photoObj) => {
          const img = document.createElement("img");
          img.src = photoObj.url;
          img.className = "carousel-img hidden";
          track.appendChild(img);
        });

        updateCarouselDOM();
        startAutoPlay();
      }

      function updateCarouselDOM() {
        const track = document.getElementById("carousel-track");
        const locationText = document.getElementById("photo-location");
        const counterText = document.getElementById("carousel-counter"); // নতুন কাউন্টার
        const images = track.querySelectorAll(".carousel-img");

        if (currentPhotos.length === 0) return;

        // লোকেশন আপডেট
        if (currentPhotos[carouselIndex].location) {
          locationText.style.display = "flex";
          locationText.innerHTML = `<i class="fa-solid fa-location-dot"></i> ${currentPhotos[carouselIndex].location}`;
        } else {
          locationText.style.display = "none";
        }

        // কাউন্টার টেক্সট আপডেট (যেমন: Image 1 of 3)
        if (counterText) {
          counterText.style.display = "block";
          counterText.textContent = `Image ${carouselIndex + 1} of ${currentPhotos.length}`;
        }

        // ছবিগুলোর ক্লাস আপডেট
        images.forEach((img, i) => {
          if (i === carouselIndex) {
            img.className = "carousel-img active";
          } else if (
            i === carouselIndex - 1 ||
            (carouselIndex === 0 && i === currentPhotos.length - 1)
          ) {
            img.className = "carousel-img prev";
          } else if (
            i === carouselIndex + 1 ||
            (carouselIndex === currentPhotos.length - 1 && i === 0)
          ) {
            img.className = "carousel-img next";
          } else {
            img.className = "carousel-img hidden";
          }
        });
      }

      function moveCarousel(direction) {
        if (currentPhotos.length <= 1) return;
        carouselIndex += direction;

        if (carouselIndex < 0) carouselIndex = currentPhotos.length - 1;
        if (carouselIndex >= currentPhotos.length) carouselIndex = 0;

        updateCarouselDOM();
        startAutoPlay(); // ইউজার ম্যানুয়ালি ক্লিক করলে টাইমার রিসেট হয়ে যাবে
      }

      // ==========================================
      // AUTO-PLAY LOGIC (অটো-স্ক্রল ফাংশন)
      // ==========================================
      function startAutoPlay() {
        stopAutoPlay(); // আগের কোনো টাইমার থাকলে সেটা ক্লিয়ার করে নতুন করে শুরু করবে
        if (currentPhotos.length > 1) {
          autoPlayInterval = setInterval(() => {
            moveCarousel(1); // ৪ সেকেন্ড পর পর সামনের দিকে স্লাইড হবে
          }, 3000); // 3000ms = 3 seconds (আপনি চাইলে সময় কমাতে/বাড়াতে পারেন)
        }
      }

      function stopAutoPlay() {
        if (autoPlayInterval) {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
        }
      }
    </script>
