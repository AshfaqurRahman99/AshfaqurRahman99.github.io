    <!-- USER PRIORITY DARK MODE SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;
            const icon = themeToggle.querySelector('i');

            // 1. Check system preference and user's saved memory
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
            const savedTheme = localStorage.getItem('user_theme_priority');

            // 2. Decide what to load: User Memory is #1 Priority, System Setting is #2
            if (savedTheme === 'dark' || (savedTheme === null && systemPrefersDark.matches)) {
                // Apply Dark Mode
                body.classList.add('dark-theme');
                icon.classList.replace('fa-moon', 'fa-sun');
                themeToggle.classList.replace('btn-dark', 'btn-light');
            } else {
                // Ensure Light Mode is strictly applied
                body.classList.remove('dark-theme');
                if (icon.classList.contains('fa-sun')) icon.classList.replace('fa-sun', 'fa-moon');
                if (themeToggle.classList.contains('btn-light')) themeToggle.classList.replace('btn-light', 'btn-dark');
            }

            // 3. Listen for clicks, toggle theme, and SAVE the user's manual choice
            themeToggle.addEventListener('click', function () {
                body.classList.toggle('dark-theme');

                if (body.classList.contains('dark-theme')) {
                    // Switched to Dark manually
                    localStorage.setItem('user_theme_priority', 'dark');
                    icon.classList.replace('fa-moon', 'fa-sun');
                    themeToggle.classList.replace('btn-dark', 'btn-light');
                } else {
                    // Switched to Light manually
                    localStorage.setItem('user_theme_priority', 'light');
                    icon.classList.replace('fa-sun', 'fa-moon');
                    themeToggle.classList.replace('btn-light', 'btn-dark');
                }
            });

            // 4. Live Sync: Only switch automatically if the user HAS NOT clicked the button yet
            systemPrefersDark.addEventListener('change', event => {
                if (localStorage.getItem('user_theme_priority') === null) {
                    if (event.matches) {
                        body.classList.add('dark-theme');
                        icon.classList.replace('fa-moon', 'fa-sun');
                        themeToggle.classList.replace('btn-dark', 'btn-light');
                    } else {
                        body.classList.remove('dark-theme');
                        icon.classList.replace('fa-sun', 'fa-moon');
                        themeToggle.classList.replace('btn-light', 'btn-dark');
                    }
                }
            });
        });
    </script>
    <!-- True Automatic Date & Copyright Script (via GitHub API) -->
    <script>
        // 1. Automatically updates the copyright year
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // 2. Automatically pulls the exact date of your last GitHub commit
        fetch('https://api.github.com/repos/AshfaqurRahman99/AshfaqurRahman99.github.io/commits?per_page=1')
            .then(response => response.json())
            .then(data => {
                const commitDate = new Date(data[0].commit.committer.date);
                const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('last-updated-date').textContent = commitDate.toLocaleDateString('en-US', dateOptions);
            })
            .catch(error => {
                // Fallback if the API is temporarily busy
                document.getElementById('last-updated-date').textContent = "Recently Updated";
            });
    </script>
